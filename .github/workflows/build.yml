# Constrói as imagens no GitHub e publica no GHCR (privado, junto com o repo).
# Assim o mini PC só baixa imagem pronta, em vez de compilar OpenCV/Tesseract com 8 GB de RAM.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: proxy,         context: proxy,          dockerfile: proxy/Dockerfile }
          - { name: historian-api, context: .,              dockerfile: services/historian-api/Dockerfile }
          - { name: mes-api,       context: .,              dockerfile: services/mes-api/Dockerfile }
          - { name: etl-mes,       context: .,              dockerfile: services/etl-mes/Dockerfile }
          - { name: ocr,           context: services/ocr,   dockerfile: services/ocr/Dockerfile }
          - { name: mcp-mes,       context: services/mcp-mes, dockerfile: services/mcp-mes/Dockerfile }
          - { name: dimep,         context: services/dimep, dockerfile: services/dimep/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - id: owner   # o GHCR exige nome em minúsculas (FabioAGC -> fabioagc)
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64   # mini PC x86; troque/adicione linux/arm64 se for ARM
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/fabrica-${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/fabrica-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
