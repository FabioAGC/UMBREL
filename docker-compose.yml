# fabrica-apps: todas as aplicações da fábrica atrás de um único endereço HTTPS.
#
# Só o proxy publica porta (443). O Umbrel já usa a 80 para o painel dele.
# Todo o resto fica na rede interna do Docker e só o proxy enxerga.
#
# No Umbrel (Portainer): use apenas VOLUMES NOMEADOS. Bind mounts somem quando o
# Portainer reinicia. Configurações e páginas vão dentro das imagens.
#
# Variáveis: ${...} vêm do .env (docker compose) ou da seção "Environment
# variables" do stack no Portainer. Veja .env.example.

name: fabrica-apps

x-base: &base
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-tz: &tz
  TZ: America/Sao_Paulo

services:
  # ---------------------------------------------------------------- entrada
  proxy:
    <<: *base
    image: ${REGISTRY:-ghcr.io/fabioagc}/fabrica-proxy:${TAG:-latest}
    build: ./proxy
    ports:
      - "443:443"
    environment:
      <<: *tz
      SITE_HOSTNAME: ${SITE_HOSTNAME:?nome DNS do mini PC}
      SITE_IP: ${SITE_IP:?IP fixo do mini PC}
      ADMIN_USER: ${ADMIN_USER:?defina ADMIN_USER}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?defina ADMIN_PASSWORD_HASH}
    volumes:
      - caddy_data:/data        # CA interna e certificados (não perder!)
      - caddy_config:/config
    mem_limit: 128m

  # ---------------------------------------------------------------- Historian
  historian-api:
    <<: *base
    image: ${REGISTRY:-ghcr.io/fabioagc}/fabrica-historian-api:${TAG:-latest}
    build:
      context: .
      dockerfile: services/historian-api/Dockerfile
    environment:
      <<: *tz
      HISTORIAN_BASE_URL: ${HISTORIAN_BASE_URL:-http://brpuwwhist1:32569/Historian/v2/ProcessValues}
      HISTORIAN_DOMAIN: ${HISTORIAN_DOMAIN:-GENMILLS}
      HISTORIAN_USER: ${HISTORIAN_USER:?conta de serviço do Historian}
      HISTORIAN_PASSWORD: ${HISTORIAN_PASSWORD:?senha da conta de serviço}
    mem_limit: 192m

  # ---------------------------------------------------------------- MES
  mes-api:
    <<: *base
    image: ${REGISTRY:-ghcr.io/fabioagc}/fabrica-mes-api:${TAG:-latest}
    build:
      context: .
      dockerfile: services/mes-api/Dockerfile
    environment: &mes_env
      <<: *tz
      MES_BASE_URL: ${MES_BASE_URL:?defina MES_BASE_URL}
      MES_TOKEN_URL: ${MES_TOKEN_URL:?defina MES_TOKEN_URL}
      MES_HOST: ${MES_HOST:-}
      MES_CLIENT_ID: ${MES_CLIENT_ID:-AIM_DefaultManagementClient}
      MES_CLIENT_SECRET: ${MES_CLIENT_SECRET:-}
      MES_USERNAME: ${MES_USERNAME:?conta de serviço do MES}
      MES_PASSWORD: ${MES_PASSWORD:?senha da conta de serviço}
      MES_VERIFY_TLS: ${MES_VERIFY_TLS:-false}
      MES_REGISTROS_PATH: ${MES_REGISTROS_PATH:-}
      MES_REGISTROS_PARAMS: ${MES_REGISTROS_PARAMS:-}
      MES_COLUNA_DATA: ${MES_COLUNA_DATA:-EventTime}
      MES_REFRESH_MIN: ${MES_REFRESH_MIN:-10}
    mem_limit: 256m

  etl-mes:
    <<: *base
    image: ${REGISTRY:-ghcr.io/fabioagc}/fabrica-etl-mes:${TAG:-latest}
    build:
      context: .
      dockerfile: services/etl-mes/Dockerfile
    environment:
      <<: *mes_env
      ETL_INTERVAL_MIN: ${ETL_INTERVAL_MIN:-60}
      ETL_INITIAL_DAYS: ${ETL_INITIAL_DAYS:-7}
      ETL_OVERLAP_HOURS: ${ETL_OVERLAP_HOURS:-6}
      ETL_CHUNK_HOURS: ${ETL_CHUNK_HOURS:-24}
      ETL_TARGET_TABLE: ${ETL_TARGET_TABLE:-MES_REGISTROS}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-}
      SNOWFLAKE_PRIVATE_KEY_B64: ${SNOWFLAKE_PRIVATE_KEY_B64:-}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}
    volumes:
      - etl_data:/data          # histórico de execuções e marca d'água
    mem_limit: 512m

  # ---------------------------------------------------------------- OCR (laudo-check)
  ocr:
    <<: *base
    image: ${REGISTRY:-ghcr.io/fabioagc}/fabrica-ocr:${TAG:-latest}
    build: ./services/ocr
    environment:
      <<: *tz
      KB_PATH: /data/kb
      LAUDO_BACKEND: ollama
      OLLAMA_URL: http://ollama:11434/v1/chat/completions
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      LLM_MODE: ${LLM_MODE:-auto}
      LLM_MAX_WORKERS: "1"      # sequencial: o Ollama reaproveita o prefixo (o laudo) entre perguntas
      LLM_TIMEOUT: "600"
    volumes:
      - ocr_data:/data          # guidelines (kb), cache de OCR e de respostas
    mem_limit: 1g

  ollama:
    <<: *base
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 5m     # descarrega o modelo após 5 min parado (libera RAM)
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 3500m

  ollama-pull:                  # roda uma vez: baixa o modelo e sai
    image: ollama/ollama:latest
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama: { condition: service_healthy }
    restart: on-failure:5

  # ---------------------------------------------------------------- MCP do MES
  mcp-mes:
    <<: *base
    image: ${REGISTRY:-ghcr.io/fabioagc}/fabrica-mcp-mes:${TAG:-latest}
    build: ./services/mcp-mes
    environment:
      <<: *mes_env
      SUPERGATEWAY_API_KEY: ${MCP_API_KEY:?gere um token longo para o MCP}
    mem_limit: 256m

  # ---------------------------------------------------------------- DIMEP (RH: só com login)
  dimep:
    <<: *base
    image: ${REGISTRY:-ghcr.io/fabioagc}/fabrica-dimep:${TAG:-latest}
    build: ./services/dimep
    environment:
      <<: *tz
      DIMEP_HOST: 0.0.0.0
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_SERVER: ${DIMEP_DB_SERVER:-}
      DB_NAME: ${DIMEP_DB_NAME:-}
      DB_USER: ${DIMEP_DB_USER:-}
      DB_PASSWORD: ${DIMEP_DB_PASSWORD:-}
      DB_EXTRA: ${DIMEP_DB_EXTRA:-Encrypt=yes;TrustServerCertificate=yes;}
    volumes:
      - dimep_data:/app/data    # parquets do LOG_ACESSO
    mem_limit: 1536m

volumes:
  caddy_data:
  caddy_config:
  etl_data:
  ocr_data:
  ollama:
  dimep_data:
