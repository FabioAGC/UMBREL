[project]
name = "laudo-check"
version = "0.1.0"
description = "Valida laudos de fornecedores contra o guideline interno usando OCR + Jev (decisões sim/não com confiança)."
requires-python = ">=3.10"
dependencies = ["pyyaml", "httpx", "pydantic>=2", "pytesseract", "pymupdf", "pillow", "numpy", "opencv-python-headless", "fastapi", "uvicorn", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
laudo-check = "laudo_check.cli:main"

[tool.setuptools]
packages = ["laudo_check"]
